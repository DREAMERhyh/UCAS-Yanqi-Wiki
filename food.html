---
layout: default
title: 饮食指南
permalink: /food/
---

{% assign food_items = site.food | where_exp: "item", "item.path contains '食堂' or item.path contains '饮品'" %}

<script id="food-data-json" type="application/json">
[
{% for item in food_items %}
  {
    "path": {{ item.path | jsonify }},
    "url": {{ item.url | jsonify }},
    "type": {{ item.type | jsonify }},
    "食堂": {{ item.食堂 | jsonify }},
    "楼层": {{ item.楼层 | jsonify }},
    "窗口编号": {{ item.窗口编号 | jsonify }},
    "窗口名称": {{ item.窗口名称 | jsonify }},
    "类别": {{ item.类别 | jsonify }},
    "简介": {{ item.简介 | jsonify }},
    "窗口": {{ item.窗口 | jsonify }},
    "菜名": {{ item.菜名 | jsonify }},
    "价格": {{ item.价格 | jsonify }},
    "供应时段": {{ item.供应时段 | jsonify }},
    "名称": {{ item.名称 | jsonify }},
    "位置": {{ item.位置 | jsonify }},
    "饮品店": {{ item.饮品店 | jsonify }},
    "品类": {{ item.品类 | jsonify }},
    "content": {{ item.content | strip | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
]
</script>

<script id="food-structure-json" type="application/json">
{{ site.data.food_structure | jsonify }}
</script>

<script id="baseurl-json" type="application/json">
{"baseurl": {{ site.baseurl | jsonify }}}
</script>

<div class="food-page">
    <div class="page-header">
        <h2>🍽️ 雁栖湖饮食指南</h2>
        <p>最全的校园吃喝攻略，食堂美食 & 特色饮品一网打尽</p>
    </div>
    
    <div class="food-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" id="search-input" placeholder="🔍 搜索菜品/饮品..." />
                <div class="sort-controls">
                    <select id="sort-select">
                        <option value="">排序方式</option>
                        <option value="price-asc">价格从低到高</option>
                        <option value="price-desc">价格从高到低</option>
                        <option value="rating-desc">评分从高到低</option>
                    </select>
                </div>
            </div>
            <nav class="nav-tree" id="nav-tree"></nav>
        </aside>
        
        <section class="content-area" id="content-area"></section>
    </div>
</div>
